<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">ReconAgent system architecture</title>
  <desc id="desc">Financial sources pass through deterministic reconciliation and verification, with uncertain cases routed through optional AI assistance and human review. All outcomes feed an audit and evaluation layer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101f"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d4ed8"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6d28d9"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#047857"/><stop offset="1" stop-color="#10b981"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#92400e"/><stop offset="1" stop-color="#d97706"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#93c5fd" stroke-opacity=".045"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
    <style>
      .label{font:700 12px system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:1.8px;fill:#60a5fa}
      .title{font:700 18px system-ui,-apple-system,Segoe UI,sans-serif;fill:#f8fafc}
      .copy{font:400 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#cbd5e1}
      .small{font:500 12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#94a3b8}
      .num{font:700 12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#bfdbfe}
      .line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1280" height="760" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="760" rx="24" fill="url(#grid)"/>
  <circle cx="1120" cy="-20" r="250" fill="#2563eb" opacity=".08"/>
  <circle cx="40" cy="760" r="220" fill="#8b5cf6" opacity=".06"/>

  <g transform="translate(56 48)">
    <text class="title" style="font-size:28px">ReconAgent system architecture</text>
    <text y="34" class="copy">Verification-first reconciliation with an explicit human control boundary</text>
  </g>
  <g transform="translate(1075 48)">
    <rect width="149" height="34" rx="17" fill="#172554" stroke="#3b82f6"/>
    <circle cx="20" cy="17" r="5" fill="#60a5fa"/>
    <text x="34" y="22" class="num">TRACK 04 · MVP</text>
  </g>

  <text x="56" y="128" class="label">01 · FINANCIAL SOURCES</text>
  <g filter="url(#shadow)">
    <g transform="translate(56 148)"><rect width="352" height="72" rx="14" fill="#111c32" stroke="#334155"/><circle cx="34" cy="36" r="14" fill="#1e40af"/><text x="34" y="41" text-anchor="middle" class="num">L</text><text x="62" y="32" class="title">Merchant ledger</text><text x="62" y="52" class="small">Orders, customers, gross value</text></g>
    <g transform="translate(464 148)"><rect width="352" height="72" rx="14" fill="#111c32" stroke="#334155"/><circle cx="34" cy="36" r="14" fill="#1e40af"/><text x="34" y="41" text-anchor="middle" class="num">S</text><text x="62" y="32" class="title">Razorpay settlements</text><text x="62" y="52" class="small">Fees, GST, refunds, payout batches</text></g>
    <g transform="translate(872 148)"><rect width="352" height="72" rx="14" fill="#111c32" stroke="#334155"/><circle cx="34" cy="36" r="14" fill="#1e40af"/><text x="34" y="41" text-anchor="middle" class="num">B</text><text x="62" y="32" class="title">Bank statement</text><text x="62" y="52" class="small">Cash credits, debits, value dates</text></g>
  </g>

  <path d="M232 220V245H210V270" class="line"/><path d="M640 220V245H210V270" class="line"/><path d="M1048 220V245H210V270" class="line"/>

  <text x="56" y="268" class="label">02 · DETERMINISTIC ENGINE</text>
  <g filter="url(#shadow)">
    <g transform="translate(56 290)"><rect width="236" height="96" rx="14" fill="url(#blue)"/><text x="20" y="27" class="num">01</text><text x="20" y="54" class="title">Validate &amp; normalize</text><text x="20" y="76" class="copy">Dates · statuses · integer paise</text></g>
    <g transform="translate(362 290)"><rect width="236" height="96" rx="14" fill="#172033" stroke="#475569"/><text x="20" y="27" class="num">02</text><text x="20" y="54" class="title">Isolate &amp; persist</text><text x="20" y="76" class="copy">New SQLite run · raw evidence</text></g>
    <g transform="translate(668 290)"><rect width="236" height="96" rx="14" fill="#172033" stroke="#475569"/><text x="20" y="27" class="num">03</text><text x="20" y="54" class="title">Connect records</text><text x="20" y="76" class="copy">Reference graph · candidates</text></g>
    <g transform="translate(974 290)"><rect width="250" height="96" rx="14" fill="#312e81" stroke="#818cf8" stroke-width="2"/><text x="20" y="27" class="num">04 · CONTROL GATE</text><text x="20" y="54" class="title">Verify every money leg</text><text x="20" y="76" class="copy">Arithmetic · lifecycle · identity</text></g>
  </g>
  <path d="M292 338H350" class="line"/><path d="M598 338H656" class="line"/><path d="M904 338H962" class="line"/>

  <text x="56" y="442" class="label">03 · CONTROLLED OUTCOMES</text>
  <path d="M1099 386V414H329V462" class="line"/><text x="728" y="409" class="small" fill="#34d399">ALL CHECKS PASS</text>
  <path d="M1099 386V438H635V462" class="line"/><text x="950" y="432" class="small" fill="#f59e0b">INCOMPLETE OR UNSAFE</text>
  <g filter="url(#shadow)">
    <g transform="translate(194 462)"><rect width="270" height="86" rx="14" fill="url(#green)"/><text x="20" y="34" class="title">Automatic match</text><text x="20" y="58" class="copy">Verified and explainable</text></g>
    <g transform="translate(500 462)"><rect width="270" height="86" rx="14" fill="url(#amber)"/><text x="20" y="34" class="title">Exception queue</text><text x="20" y="58" class="copy">Evidence preserved · no guess</text></g>
    <g transform="translate(806 462)"><rect width="194" height="86" rx="14" fill="url(#violet)"/><text x="20" y="34" class="title">Optional AI</text><text x="20" y="58" class="copy">Hypothesis only</text></g>
    <g transform="translate(1036 462)"><rect width="188" height="86" rx="14" fill="#172554" stroke="#60a5fa"/><text x="20" y="34" class="title">Human review</text><text x="20" y="58" class="copy">Approve or reject</text></g>
  </g>
  <path d="M770 505H794" class="line"/><path d="M1000 505H1024" class="line"/>
  <path d="M1130 548V578H329V560" class="line"/><text x="645" y="573" class="small">APPROVAL IS REVERIFIED BY THE BACKEND</text>

  <g transform="translate(56 620)">
    <rect width="1168" height="92" rx="16" fill="#0f1d31" stroke="#334155"/>
    <text x="22" y="27" class="label">04 · AUDIT &amp; MEASUREMENT</text>
    <g transform="translate(22 43)"><rect width="250" height="32" rx="8" fill="#172554"/><text x="16" y="21" class="copy">Append-only audit trail</text></g>
    <path d="M286 59H322" class="line"/>
    <g transform="translate(334 43)"><rect width="250" height="32" rx="8" fill="#172554"/><text x="16" y="21" class="copy">Evaluator-only ground truth</text></g>
    <path d="M598 59H634" class="line"/>
    <g transform="translate(646 43)"><rect width="220" height="32" rx="8" fill="#172554"/><text x="16" y="21" class="copy">Exact-set evaluation</text></g>
    <path d="M880 59H916" class="line"/>
    <g transform="translate(928 43)"><rect width="218" height="32" rx="8" fill="#172554"/><text x="16" y="21" class="copy">Metrics &amp; dashboard</text></g>
  </g>
  <text x="56" y="742" class="small">AI can explain an unresolved case. It cannot alter evidence, create an automatic match, or move money.</text>
</svg>
